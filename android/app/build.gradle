plugins {
    id 'com.android.application'
}

android {
    namespace 'com.samplecollege.cdcms'
    compileSdk 35

    defaultConfig {
        // Provisional application ID. Confirm TD-R14 before publishing or store distribution.
        applicationId 'com.samplecollege.cdcms'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
